<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-label="A modern glass-walled meeting room">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#1c1e24"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2622"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a4535"/>
      <stop offset="1" stop-color="#3b2d23"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <!-- city blocks seen through the glass -->
  <g fill="#0f1116" opacity="0.9">
    <rect x="0" y="260" width="120" height="200"/>
    <rect x="140" y="200" width="90" height="260"/>
    <rect x="250" y="300" width="160" height="160"/>
    <rect x="430" y="150" width="110" height="310"/>
    <rect x="560" y="240" width="200" height="220"/>
    <rect x="780" y="180" width="80" height="280"/>
    <rect x="880" y="280" width="190" height="180"/>
    <rect x="1090" y="120" width="130" height="340"/>
    <rect x="1240" y="230" width="160" height="230"/>
    <rect x="1420" y="170" width="180" height="290"/>
  </g>
  <g fill="#f5d08a" opacity="0.35">
    <rect x="455" y="190" width="10" height="14"/><rect x="480" y="230" width="10" height="14"/><rect x="505" y="260" width="10" height="14"/>
    <rect x="1115" y="160" width="10" height="14"/><rect x="1150" y="200" width="10" height="14"/><rect x="1180" y="260" width="10" height="14"/>
    <rect x="160" y="240" width="10" height="14"/><rect x="195" y="300" width="10" height="14"/>
    <rect x="1450" y="220" width="10" height="14"/><rect x="1530" y="300" width="10" height="14"/>
  </g>
  <!-- floor -->
  <rect x="0" y="460" width="1600" height="240" fill="url(#floor)"/>
  <!-- glass wall panes and mullions -->
  <g fill="url(#pane)" stroke="#dfe7f0" stroke-opacity="0.22" stroke-width="3">
    <rect x="0" y="0" width="400" height="460"/>
    <rect x="400" y="0" width="400" height="460"/>
    <rect x="800" y="0" width="400" height="460"/>
    <rect x="1200" y="0" width="400" height="460"/>
  </g>
  <rect x="0" y="456" width="1600" height="8" fill="#8f98a3" opacity="0.6"/>
  <!-- long table in perspective -->
  <path d="M200 700 L520 470 L1080 470 L1400 700 Z" fill="url(#table)"/>
  <path d="M520 470 L1080 470 L1070 482 L530 482 Z" fill="#7a5f4a"/>
  <!-- table reflection -->
  <path d="M560 476 L1040 476 L980 520 L620 520 Z" fill="#ffffff" opacity="0.05"/>
  <!-- chairs -->
  <g fill="#1a1a1f" stroke="#5c5f66" stroke-opacity="0.5" stroke-width="2">
    <rect x="430" y="520" width="70" height="90" rx="8"/>
    <rect x="330" y="580" width="80" height="110" rx="8"/>
    <rect x="1100" y="520" width="70" height="90" rx="8"/>
    <rect x="1190" y="580" width="80" height="110" rx="8"/>
    <rect x="700" y="440" width="50" height="40" rx="6"/>
    <rect x="850" y="440" width="50" height="40" rx="6"/>
  </g>
  <!-- ceiling light strips -->
  <g fill="#fff6e0" opacity="0.5">
    <rect x="300" y="24" width="400" height="6" rx="3"/>
    <rect x="900" y="24" width="400" height="6" rx="3"/>
  </g>
</svg>
